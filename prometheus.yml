global:
  scrape_interval: 15s       # Prometheus interroge l'API toutes les 15 secondes
  evaluation_interval: 15s

scrape_configs:
  - job_name: "accidents_api"
    # L'Instrumentator FastAPI expose les métriques sur /monitoring (voir api/main_api.py),
    # et non sur le /metrics par défaut de Prometheus (occupé par les métriques du modèle).
    metrics_path: /monitoring
    # Le service api tourne en 3 replicas : la résolution DNS de "api" renvoie les 3
    # adresses. dns_sd_configs les découvre comme 3 targets distinctes, sinon Prometheus
    # tomberait au hasard sur un seul replica à chaque scrape et les compteurs seraient
    # incohérents.
    dns_sd_configs:
      - names: ["api"]   # nom du service Docker Compose
        type: A
        port: 8000
