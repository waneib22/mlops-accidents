# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Tests Python application
 
on:
  push:
    branches: [ "master", "DVC-MLFlow-CI" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest


    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"


    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
 

    - name: Install dependencies
      run: uv sync --frozen


    - name: Lint with flake8
      run: |
        uv run flake8 src api tests \
        --count \
        --select=E9,F63,F7,F82 \
        --show-source \
        --statistics

    #recuperer les données car inexistant sur github
    - name: Install DVC
      run: uv pip install dvc dvc-http


    #se connecter à DVC/DAGSHUB
    - name: Configure DVC remote credentials
      run: |
        uv run dvc remote modify remote_dagshub --local auth basic
        uv run dvc remote modify remote_dagshub --local user "${{ secrets.MLFLOW_TRACKING_USERNAME }}"
        uv run dvc remote modify remote_dagshub --local password "${{ secrets.MLFLOW_TRACKING_PASSWORD }}"


    - name: Pull DVC data
      run: uv run dvc pull

    #lancer les tests
    - name: Test with pytest
      run: uv run pytest tests -vv
