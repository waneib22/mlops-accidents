[project]
name = "mlops-melanie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
#requires-python = ">=3.11,<3.12"
dependencies = [
    "click>=8.4.0",
    "coverage>=7.14.0",
    "dvc[gdrive]>=3.67.1",
    "fastapi>=0.136.1",
    "flake8>=7.3.0",
    "imbalanced-learn>=0.14.1",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=2.0,<3.0",
    "pathlib>=1.0.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "sphinx>=9.1.0",
    "uvicorn>=0.47.0",
    "mlflow>=2.0",
    "dagshub>=0.5.0",
    "httpx2>=2.7.0",  #httpx2 car Starlette (utilisé par FastAPI pour son TestClient) recommande désormais ce fork maintenu par Pydantic à la place de httpx, dont le développement a ralenti — ça évite le warning de dépréciation dans mes tests."
    "dvc-http>=2.32.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
