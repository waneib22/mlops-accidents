
# ─────────────────────────────────────────────────────────────
# Configuration commune aux conteneurs Airflow
#
# Les services Airflow sont derrière le profil "airflow" : `docker compose up`
# reste strictement identique à avant (api, nginx, prometheus, grafana).
# Pour les démarrer : `make airflow-up` (voir docs/airflow.md).
# ─────────────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: accidents-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Vide = pas de chiffrement des Variables/Connections, comme dans le
    # docker-compose officiel Airflow. Suffisant ici : aucun secret n'est
    # stocké en base, les identifiants DagsHub passent par l'environnement.
    AIRFLOW__CORE__FERNET_KEY: ""
    # Partagée par le webserver et le scheduler, sinon le webserver ne peut
    # pas récupérer les logs des tâches.
    AIRFLOW__WEBSERVER__SECRET_KEY: accidents-mlops-dev
    PYTHONPATH: /opt/airflow/project
    ACCIDENTS_API_URL: http://api:8000
    PROMETHEUS_URL: http://prometheus:9090
    # Nécessaires à l'écriture dans MLflow/DagsHub lors de l'entraînement.
    MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
    MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
    DAGSHUB_USER_TOKEN: ${DAGSHUB_USER_TOKEN:-}
  volumes:
    - ./dags:/opt/airflow/dags
    # Le projet est monté sous /opt/airflow/project : les tâches exécutent
    # les scripts de src/ et écrivent dans data/ et metrics/.
    - ./src:/opt/airflow/project/src
    - ./data:/opt/airflow/project/data
    - ./metrics:/opt/airflow/project/metrics
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
  profiles: ["airflow"]

services:

# ─────────────────────
# API FastAPI
# ─────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    ports:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
    
    #environment:
    #  - MLFLOW_TRACKING_USERNAME
    #  - MLFLOW_TRACKING_PASSWORD

    env_file:
      - .env

# NOTE : le serveur MLflow local (image mlflow/mlflow) a été retiré.
# Le tracking se fait désormais sur DagsHub (https://dagshub.com/Melanie94480/mlops-melanie.mlflow),
# où le modèle est déjà enregistré. L'UI MLflow de la démo, c'est celle de DagsHub, pas un conteneur local.


# ─────────────────────
# MLflow tracking server (désactivé — tracking sur DagsHub désormais)
