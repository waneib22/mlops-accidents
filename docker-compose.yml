
services:

# ─────────────────────
# API FastAPI
# ─────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    ports:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api


# ─────────────────────
# MLflow tracking server
# ─────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow_server
    working_dir: /mlflow
    volumes:
      - ./mlflow:/mlflow
    ports:
      - "8080:8080"
    command: 
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backend-store-uri 
      - sqlite:///mlflow.db
      - --default-artifact-root 
      - /mlflow/mlruns
      - --serve-artifacts
      - --allowed-hosts
      - "mlflow:8080,mlflow,localhost:*,127.0.0.1:*"

# ─────────────────────
# Nginx
# ─────────────────────
  nginx:
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
    - api


# ─────────────────────
# Prometheus
# ─────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api


# ─────────────────────
# Grafana
# ─────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus


volumes:
  grafana_data:
