
services:

# ─────────────────────
# API FastAPI
# ─────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    ports:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
    
    #environment:
    #  - MLFLOW_TRACKING_USERNAME
    #  - MLFLOW_TRACKING_PASSWORD

    env_file:
      - .env

